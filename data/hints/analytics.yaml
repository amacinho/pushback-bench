- id: ana-metric
  domain: analytics
  hint: >-
    Choosing the primary success metric for a checkout-page A/B test:
    conversion rate vs revenue per visitor.
- id: ana-missing
  domain: analytics
  hint: >-
    Handling missing income values in a loan-default modeling dataset:
